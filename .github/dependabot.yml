version: 2

# External release archives such as libsodium are updated by
# .github/workflows/update-libsodium-version.yml because Dependabot only
# supports manifest-backed ecosystems and GitHub Actions references.

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "gomod"
    directory: "/cmd/pg/exporter"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
